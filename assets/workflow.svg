<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Listen, Map, Slice, Build, Show, Hand off" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1200" height="230" rx="20" fill="#0f172a"/>
