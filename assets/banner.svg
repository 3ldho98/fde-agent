<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Forward Deployed Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0891b2"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g fill="#ffffff" opacity="0.14">
      <circle cx="140" cy="260" r="46"><animate attributeName="cy" values="260;200;260" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="80" r="62"><animate attributeName="cy" values="80;130;80" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="270" r="28"><animate attributeName="cy" values="270;220;270" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="50" r="22"><animate attributeName="cy" values="50;95;50" dur="7s" repeatCount="indefinite"/></circle>
    </g>
    <text x="600" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#a5f3fc" letter-spacing="8">YOUR AI AGENT, AS A</text>
    <text x="600" y="205" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">Forward Deployed Engineer</text>
    <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#e0e7ff" text-anchor="middle">
      <text x="600" y="262" opacity="0">Listens first. Ships the same day.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
      <text x="600" y="262" opacity="0">Your customer's stack. Your demo. Today.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
      <text x="600" y="262" opacity="0">Prototype, Pilot or Production. Always labeled.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>
    </g>
    <circle cx="56" cy="48" r="8" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#d1fae5">ready to ship</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
